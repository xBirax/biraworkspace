<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ADR Overlay</title>
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      html,
      body {
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      .hidden {
        display: none !important;
      }

      /* Command palette */
      #palette {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 30;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 14vh;
      }
      #palette .box {
        width: min(480px, 90vw);
        background: var(--bar);
        border: 1px solid var(--line2);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.8);
      }
      #palette input {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        background: transparent;
        color: var(--fg);
        padding: 16px 18px;
        font-size: 14px;
        outline: none;
      }
      #palette-results {
        max-height: 320px;
        overflow: auto;
        padding: 6px;
      }
      #palette-results .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        color: var(--fg);
        padding: 10px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
      }
      #palette-results .item:hover,
      #palette-results .item.active {
        background: var(--card);
      }
      #palette-results .item small {
        color: var(--dim);
        font-size: 11px;
      }

      /* Slide-over de notificações */
      #notif {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 360px;
        background: var(--card);
        border-left: 1px solid var(--line2);
        box-shadow: -24px 0 60px -20px rgba(0, 0, 0, 0.7);
        z-index: 15;
        display: flex;
        flex-direction: column;
      }
      #notif-backdrop {
        position: fixed;
        inset: 0;
        z-index: 14;
      }
      #notif header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
        font-weight: 700;
      }
      #notif .close {
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: grid;
        place-items: center;
      }
      #notif .close:hover {
        background: var(--hover);
      }
      #notif .actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #notif-clear {
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        padding: 4px 8px;
        border-radius: 8px;
      }
      #notif-clear:hover {
        background: var(--hover);
        color: var(--fg);
      }
      #notif-list {
        flex: 1;
        overflow: auto;
      }
      .nrow {
        display: flex;
        gap: 10px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        width: 100%;
        text-align: left;
        border-left: 0;
        border-right: 0;
        border-top: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: default;
      }
      .nrow.clickable {
        cursor: pointer;
      }
      .nrow.clickable:hover {
        background: var(--hover);
      }
      .nrow .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--accent);
        margin-top: 6px;
        flex-shrink: 0;
      }
      .nrow.read .dot {
        background: var(--dim);
      }
      .nrow .text {
        font-size: 13px;
        color: var(--fg2);
      }
      .nrow .time {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      .empty {
        padding: 24px 18px;
        font-size: 13px;
        color: var(--muted);
      }

      /* Toast */
      #toast {
        position: fixed;
        bottom: 16px;
        left: 16px;
        /* max-content: a largura não depende do viewport, que main ainda deixa
           no tamanho do toast ANTERIOR quando este é medido. Sem isto, depois de
           um aviso curto os seguintes saíam espremidos numa coluna. */
        width: max-content;
        max-width: 380px;
        background: var(--card);
        border: 1px solid var(--line2);
        color: var(--fg);
        font-size: 13px;
        padding: 10px 16px;
        border-radius: 10px;
        box-shadow: var(--shadow-pop);
        z-index: 40;
      }
    </style>
    <link rel="stylesheet" href="./internal-surfaces.css" />
  </head>
  <body data-adr-surface="overlay">
    <div id="notif-backdrop" class="hidden"></div>
    <aside id="notif" class="hidden" role="dialog" aria-modal="true" aria-label="Notificações">
      <header>
        <div class="notif-heading">Notificações<small>Atualizações do seu workspace</small></div>
        <div class="actions">
          <button type="button" id="notif-clear" title="Limpar notificações">Limpar</button>
          <button type="button" class="close" id="notif-close" title="Fechar" aria-label="Fechar notificações">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          </button>
        </div>
      </header>
      <div id="notif-list"></div>
    </aside>

    <div id="palette" class="hidden" role="dialog" aria-modal="true" aria-label="Busca rápida">
      <div class="box">
        <div class="palette-heading"><strong>Busca rápida</strong><span><kbd>Esc</kbd> para fechar</span></div>
        <input id="palette-input" type="search" role="combobox" aria-label="Buscar serviços, workspaces e ações" aria-autocomplete="list" aria-expanded="true" aria-controls="palette-results" placeholder="Buscar serviços, workspaces e ações…" autocomplete="off" />
        <div id="palette-results" role="listbox" aria-label="Resultados da busca"></div>
        <div class="palette-footer"><span><kbd>↑</kbd> <kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span></div>
      </div>
    </div>

    <div id="toast" class="hidden" role="status" aria-live="polite"></div>

    <script src="./theme.js"></script>
    <script>
      let state = { services: [], workspaces: [], feed: [] };
      let items = [];
      let index = 0;
      let lastFeedSignature = "";

      const el = (id) => document.getElementById(id);
      const show = (node, on) => node.classList.toggle("hidden", !on);

      function ago(ts) {
        const min = Math.floor((Date.now() - ts) / 60000);
        if (min < 1) return "agora";
        if (min < 60) return min + " min";
        const h = Math.floor(min / 60);
        if (h < 24) return h + " h";
        return Math.floor(h / 24) + " d";
      }

      function renderFeed() {
        const root = el("notif-list");
        const feed = state.feed || [];
        const signature = JSON.stringify([Math.floor(Date.now() / 60_000), feed.map((item) => [item.id, item.text, item.ts, item.read, item.url, item.surface])]);
        if (signature === lastFeedSignature) return;
        lastFeedSignature = signature;
        const focusedId = document.activeElement?.dataset?.feedId;
        root.innerHTML = "";
        if (!feed.length) {
          root.innerHTML = '<div class="empty"><strong>Tudo em dia</strong>Nenhuma notificação por enquanto.</div>';
          el("notif-clear").disabled = true;
          return;
        }
        el("notif-clear").disabled = false;
        for (const n of feed) {
          const row = document.createElement(n.url || n.surface ? "button" : "div");
          row.dataset.feedId = n.id;
          if (row.tagName === "BUTTON") row.type = "button";
          row.className = "nrow" + (n.read ? " read" : "") + (n.url || n.surface ? " clickable" : "");
          row.innerHTML =
            '<div class="dot"></div><div><div class="text"></div><div class="time"></div></div>';
          row.querySelector(".text").textContent = n.text;
          row.querySelector(".time").textContent = ago(n.ts);
          if (n.url) row.addEventListener("click", () => window.adrShell?.openExternalBrowser(n.url, "auto"));
          else if (n.surface) row.addEventListener("click", () => window.adrShell?.show(n.surface));
          root.appendChild(row);
        }
        if (focusedId) [...root.children].find((row) => row.dataset.feedId === focusedId)?.focus({ preventScroll: true });
      }

      function paletteActions(query) {
        const q = (query || "").trim().toLowerCase();
        const actions = [
          { label: "Now! — CRM ADR", hint: "Ctrl+0", run: () => window.adrShell?.show("crm") },
          { label: "Configurações", hint: "Ctrl+,", run: () => window.adrShell?.show("settings") },
          { label: "Notificações", hint: "", run: () => window.adrShell?.toggleNotifPanel() },
          { label: "Recarregar", hint: "Ctrl+R", run: () => window.adrShell?.reload(false) },
        ];
        for (const svc of state.services || []) {
          actions.push({ label: svc.name, hint: "Serviço", run: () => window.adrShell?.show("service:" + svc.id) });
        }
        for (const ws of state.workspaces || []) {
          actions.push({ label: "Workspace " + ws.name, hint: "Workspace", run: () => window.adrShell?.setWorkspace(ws.id) });
        }
        if (!q) return actions.slice(0, 12);
        return actions.filter((a) => (a.label + " " + a.hint).toLowerCase().includes(q)).slice(0, 12);
      }

      function renderPalette(query) {
        const root = el("palette-results");
        items = paletteActions(query);
        index = 0;
        root.innerHTML = "";
        if (!items.length) {
          root.innerHTML = '<div class="empty">Nenhum resultado encontrado.</div>';
          el("palette-input").removeAttribute("aria-activedescendant");
          return;
        }
        items.forEach((item, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "item" + (i === 0 ? " active" : "");
          btn.id = "palette-result-" + i;
          btn.setAttribute("role", "option");
          btn.setAttribute("aria-selected", String(i === 0));
          btn.innerHTML = "<span></span><small></small>";
          btn.firstChild.textContent = item.label;
          btn.lastChild.textContent = item.hint || "";
          btn.addEventListener("click", () => {
            closePalette();
            item.run();
          });
          root.appendChild(btn);
        });
        el("palette-input").setAttribute("aria-activedescendant", "palette-result-0");
      }

      function closePalette() {
        show(el("palette"), false);
        window.adrShell?.closePalette();
      }

      function openPalette() {
        show(el("palette"), true);
        const input = el("palette-input");
        input.value = "";
        renderPalette("");
        input.focus();
      }

      el("palette-input").addEventListener("input", (e) => renderPalette(e.target.value));
      el("palette-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          const item = items[index];
          closePalette();
          item?.run();
          return;
        }
        if (e.key === "ArrowDown") index = Math.min(items.length - 1, index + 1);
        else if (e.key === "ArrowUp") index = Math.max(0, index - 1);
        else return;
        e.preventDefault();
        [...el("palette-results").children].forEach((c, i) => {
          c.classList.toggle("active", i === index);
          c.setAttribute("aria-selected", String(i === index));
          // A lista rola só até o 7º item; sem isto a seleção sumia da vista.
          if (i === index) c.scrollIntoView({ block: "nearest" });
        });
        if (items.length) el("palette-input").setAttribute("aria-activedescendant", "palette-result-" + index);
      });
      el("palette").addEventListener("click", (e) => {
        if (e.target.id === "palette") closePalette();
      });
      el("notif-clear").addEventListener("click", () => window.adrShell?.clearNotifications());
      el("notif-close").addEventListener("click", () => window.adrShell?.toggleNotifPanel());
      el("notif-backdrop").addEventListener("click", () => window.adrShell?.toggleNotifPanel());
      window.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        // Foco nos resultados (Tab) também fecha: só o campo de busca ouvia o Esc.
        if (!el("palette").classList.contains("hidden")) {
          e.preventDefault();
          closePalette();
        } else if (!el("notif").classList.contains("hidden")) {
          e.preventDefault();
          window.adrShell?.toggleNotifPanel();
        }
      });

      let toastTimer = null;
      // A view do overlay é recortada no tamanho do toast (ver layoutOverlay):
      // sem medir, ela ficava 420x88 comendo cliques do serviço embaixo.
      function hideToast() {
        show(el("toast"), false);
        clearTimeout(toastTimer);
        window.adrShell?.toastBounds(0, 0);
      }
      el("toast").addEventListener("click", hideToast);
      window.adrShell?.onToast?.((message) => {
        const node = el("toast");
        node.textContent = String(message || "");
        show(node, true);
        requestAnimationFrame(() => {
          const box = node.getBoundingClientRect();
          window.adrShell?.toastBounds(Math.ceil(box.width) + 32, Math.ceil(box.height) + 32);
        });
        clearTimeout(toastTimer);
        toastTimer = setTimeout(hideToast, 3200);
      });
      window.adrShell?.onPalette?.(() => openPalette());
      window.adrShell?.onNotifPanel?.((open) => {
        show(el("notif"), open);
        show(el("notif-backdrop"), open);
        if (open) el("notif-close").focus();
      });
      // "Tamanho da interface" também na paleta e nas notificações. O toast fica
      // de fora: o tamanho dele é medido e recortado no main.
      function applyScale() {
        const zoom = Number(state.uiScale) || 1;
        // Só o conteúdo: zoom nos fixos de tela inteira deslocava o fundo e a borda.
        el("palette").querySelector(".box").style.zoom = String(zoom);
        el("notif").style.width = 360 * zoom + "px";
        for (const child of el("notif").children) child.style.zoom = String(zoom);
      }
      window.adrShell?.onState?.((next) => {
        state = { ...state, ...(next || {}) };
        window.__adrState = state;
        applyTheme(state);
        applyScale();
        renderFeed();
      });
      window.adrShell?.getState?.().then((next) => {
        state = { ...state, ...(next || {}) };
        window.__adrState = state;
        applyTheme(state);
        applyScale();
        renderFeed();
      });
    </script>
  </body>
</html>
