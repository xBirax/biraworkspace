<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Histórico — ADR Browser</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:" />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      :root {
        /* Fundo de campo e de selo visível nos dois temas (branco sobre branco no
           claro era o problema da mistura card/bar). */
        --field: color-mix(in srgb, var(--fg) 7%, transparent);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.4 var(--adr-font);
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--line2);
        background: var(--bar);
      }
      h1 {
        margin: 0 12px 0 0;
        font-size: 18px;
        font-weight: 600;
      }
      .search {
        position: relative;
        flex: 1;
        max-width: 560px;
      }
      .search svg {
        position: absolute;
        left: 14px;
        top: 10px;
        color: var(--muted);
        pointer-events: none;
      }
      #query {
        width: 100%;
        height: 36px;
        box-sizing: border-box;
        padding: 0 16px 0 40px;
        border: 1px solid transparent;
        border-radius: 18px;
        background: var(--field);
        color: var(--fg);
        font: inherit;
        outline: none;
        transition: border-color var(--fast), box-shadow var(--fast);
      }
      #query:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      #clear {
        margin-left: auto;
        height: 34px;
        padding: 0 14px;
        border: 1px solid var(--line2);
        border-radius: 17px;
        background: transparent;
        color: var(--fg2);
        transition: background-color var(--fast);
      }
      #clear:hover {
        background: var(--hover);
      }
      #clear:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:focus-visible,
      .item:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      #notice {
        display: none;
        margin: 12px 24px 0;
        padding: 10px 14px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--warn) 14%, transparent);
        color: var(--fg2);
        font-size: 13px;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 8px 24px 32px;
      }
      .day {
        max-width: 880px;
        margin: 16px auto 0;
      }
      .day h2 {
        margin: 0 0 6px;
        padding: 0 12px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .list {
        margin: 0;
        padding: 4px 0;
        list-style: none;
        border-radius: 12px;
        background: var(--card);
        border: 1px solid var(--line);
      }
      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 44px;
        padding: 0 8px 0 12px;
        border-radius: 8px;
        margin: 0 4px;
        cursor: pointer;
        outline: none;
      }
      .item:hover {
        background: var(--hover);
      }
      .time {
        flex: none;
        width: 44px;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .badge {
        flex: none;
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--field);
        color: var(--fg2);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .text {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .title {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .host {
        flex: none;
        max-width: 40%;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--muted);
        font-size: 12px;
      }
      .remove {
        flex: none;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        opacity: 0;
        transition: opacity var(--fast), background-color var(--fast);
      }
      .item:hover .remove,
      .item:focus-within .remove,
      .remove:focus-visible {
        opacity: 1;
      }
      .remove:hover {
        background: var(--hover);
        color: var(--fg);
      }
      .empty {
        max-width: 420px;
        margin: 72px auto 0;
        text-align: center;
        color: var(--muted);
      }
      .empty strong {
        display: block;
        margin-bottom: 6px;
        color: var(--fg2);
        font-size: 15px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Histórico</h1>
      <div class="search" role="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m20 20-4.8-4.8"></path></svg>
        <input id="query" type="search" placeholder="Buscar no histórico" aria-label="Buscar no histórico" spellcheck="false" autofocus />
      </div>
      <button id="clear" type="button">Limpar histórico</button>
    </header>
    <div id="notice" role="status">
      O histórico fica só enquanto o app estiver aberto: a criptografia do Windows não está
      disponível, e ele não é gravado no disco sem ela.
    </div>
    <main id="results" aria-live="polite"></main>
    <script src="./theme.js"></script>
    <script>
      const results = document.getElementById("results");
      const query = document.getElementById("query");
      const clearButton = document.getElementById("clear");
      const timeFormat = new Intl.DateTimeFormat("pt-BR", { hour: "2-digit", minute: "2-digit" });
      const dayFormat = new Intl.DateTimeFormat("pt-BR", { weekday: "long", day: "numeric", month: "long" });
      const removeIcon =
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"></path></svg>';

      function dayLabel(time) {
        const date = new Date(time);
        const start = new Date();
        start.setHours(0, 0, 0, 0);
        const day = new Date(date);
        day.setHours(0, 0, 0, 0);
        const diff = Math.round((start - day) / 86400000);
        const long = dayFormat.format(date);
        if (diff === 0) return `Hoje — ${long}`;
        if (diff === 1) return `Ontem — ${long}`;
        return long;
      }

      function hostOf(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch {
          return url;
        }
      }

      function renderEmpty(text, detail) {
        results.textContent = "";
        const box = document.createElement("div");
        box.className = "empty";
        const strong = document.createElement("strong");
        strong.textContent = text;
        box.append(strong, detail);
        results.append(box);
      }

      function render(entries, term) {
        clearButton.disabled = !entries.length && !term;
        if (!entries.length) {
          if (term) renderEmpty(`Nada encontrado para “${term}”`, "Tente outra palavra do título ou do endereço.");
          else renderEmpty("O histórico está vazio", "As páginas que você abrir no ADR Browser aparecem aqui.");
          return;
        }
        results.textContent = "";
        let currentDay = "";
        let list = null;
        for (const entry of entries) {
          const label = dayLabel(entry.lastVisitedAt);
          if (label !== currentDay) {
            currentDay = label;
            const section = document.createElement("section");
            section.className = "day";
            const heading = document.createElement("h2");
            heading.textContent = label;
            list = document.createElement("ul");
            list.className = "list";
            section.append(heading, list);
            results.append(section);
          }
          const host = hostOf(entry.url);
          const item = document.createElement("li");
          item.className = "item";
          item.tabIndex = 0;
          item.title = entry.url;
          item.dataset.url = entry.url;
          const time = document.createElement("span");
          time.className = "time";
          time.textContent = timeFormat.format(new Date(entry.lastVisitedAt));
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.setAttribute("aria-hidden", "true");
          badge.textContent = host.charAt(0) || "?";
          const text = document.createElement("span");
          text.className = "text";
          const title = document.createElement("span");
          title.className = "title";
          title.textContent = entry.title || host;
          const hostEl = document.createElement("span");
          hostEl.className = "host";
          hostEl.textContent = host;
          text.append(title, hostEl);
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "remove";
          remove.innerHTML = removeIcon;
          remove.title = "Remover do histórico";
          remove.setAttribute("aria-label", `Remover ${entry.title || host} do histórico`);
          item.append(time, badge, text, remove);
          list.append(item);
        }
      }

      let searchToken = 0;
      async function refresh() {
        const token = ++searchToken;
        const term = query.value.trim();
        const entries = (await window.adrHistory?.search(term)) || [];
        if (token === searchToken) render(entries, term);
      }

      let debounce;
      query.addEventListener("input", () => {
        clearTimeout(debounce);
        debounce = setTimeout(refresh, 120);
      });

      results.addEventListener("click", async (e) => {
        const item = e.target instanceof Element ? e.target.closest(".item") : null;
        if (!item) return;
        if (e.target.closest(".remove")) {
          await window.adrHistory?.remove(item.dataset.url);
          refresh();
          return;
        }
        window.adrHistory?.open(item.dataset.url);
      });
      results.addEventListener("keydown", async (e) => {
        const item = e.target instanceof Element ? e.target.closest(".item") : null;
        if (!item || e.target !== item) return;
        if (e.key === "Enter") {
          e.preventDefault();
          window.adrHistory?.open(item.dataset.url);
        } else if (e.key === "Delete") {
          e.preventDefault();
          const next = item.nextElementSibling || item.previousElementSibling;
          await window.adrHistory?.remove(item.dataset.url);
          await refresh();
          const again = next && results.querySelector(`.item[data-url="${CSS.escape(next.dataset.url)}"]`);
          (again || query).focus();
        } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          const items = [...results.querySelectorAll(".item")];
          const index = items.indexOf(item) + (e.key === "ArrowDown" ? 1 : -1);
          items[Math.max(0, Math.min(index, items.length - 1))]?.focus();
        }
      });
      query.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          results.querySelector(".item")?.focus();
        }
      });
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && (e.key === "f" || e.key === "F")) {
          e.preventDefault();
          query.focus();
          query.select();
        } else if (e.key === "Escape") {
          // 1º Esc limpa a busca; com ela vazia, fecha a janela.
          if (query.value) {
            query.value = "";
            refresh();
            query.focus();
          } else {
            window.close();
          }
        }
      });
      clearButton.onclick = async () => {
        const result = await window.adrHistory?.clear();
        if (result?.ok) refresh();
      };

      window.adrHistory?.onChanged?.(refresh);
      window.adrHistory
        ?.getAppearance?.()
        .then((state) => {
          window.__adrState = state || { theme: "system" };
          applyTheme(window.__adrState);
          document.getElementById("notice").style.display = state && state.persistent === false ? "block" : "none";
        })
        .catch(() => applyTheme({ theme: "system" }));
      applyTheme({ theme: "system" });
      refresh();
    </script>
  </body>
</html>
